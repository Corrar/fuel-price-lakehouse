[project]
name = "fuel-price-lakehouse"
version = "0.0.1"
description = "Weekly incremental pipeline for Brazilian fuel prices (ANP) and macro series (Banco Central SGS): raw, staged, quarantine and curated Parquet layers with a published data quality report."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28",
    "pandas>=2.2",
    "pandera[pandas]>=0.22",
    "pyarrow>=18",
    "tenacity>=9",
]

[project.scripts]
fuel-lakehouse = "fuel_price_lakehouse.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "openpyxl>=3.1.5",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuel_price_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tools"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "pandera.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["fuel_price_lakehouse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
