name: diag-anp
# Temporary: how www.gov.br answers a GitHub-hosted runner. Deleted after use.
on:
  push:
    branches: [diag-anp]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev
      - name: Probe from Python
        run: |
          uv run --no-sync python - <<'PY'
          import socket, ssl, sys, time, urllib.request
          import httpx
          from fuel_price_lakehouse.collect.anp import LANDING_PAGE as page
          from fuel_price_lakehouse.collect.http import default_client
          print(sys.version, ssl.OPENSSL_VERSION, httpx.__version__)
          def attempt(label, call):
              start = time.monotonic()
              try:
                  result = call()
                  print(f"{label}: OK {result} in {time.monotonic() - start:.1f}s")
              except Exception as error:
                  print(f"{label}: {type(error).__name__}: {error} after {time.monotonic() - start:.1f}s")
          def only(group):
              context = httpx.create_ssl_context()
              context.set_ecdh_curve(group)
              return context
          bcb = "https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/1?formato=json"
          probe = "https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos/shpc/dsas/glp/glp-2026-01.csv"
          for label, verify in (("default", True), ("prime256v1", "P256"), ("X25519", "X")):
              for round_ in range(5):
                  if verify == "P256":
                      ctx = only("prime256v1")
                  elif verify == "X":
                      ctx = only("X25519")
                  else:
                      ctx = httpx.create_ssl_context()
                  client = httpx.Client(verify=ctx, timeout=httpx.Timeout(30.0, connect=15.0), follow_redirects=True)
                  attempt(f"{label} #{round_} ANP page", lambda: client.get(page).status_code)
                  attempt(f"{label} #{round_} ANP range", lambda: client.get(probe, headers={"Range": "bytes=0-0"}).status_code)
                  attempt(f"{label} #{round_} BCB", lambda: client.get(bcb).status_code)
                  client.close()
                  time.sleep(1)
          PY
