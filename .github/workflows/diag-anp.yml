name: diag-anp
# Temporary: how www.gov.br answers a GitHub-hosted runner. Deleted after use.
on:
  push:
    branches: [diag-anp]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev
      - name: Probe from Python
        run: |
          uv run --no-sync python - <<'PY'
          import socket, ssl, sys, time, urllib.request
          import httpx
          from fuel_price_lakehouse.collect.anp import LANDING_PAGE as page
          from fuel_price_lakehouse.collect.http import default_client
          print(sys.version, ssl.OPENSSL_VERSION, httpx.__version__)
          def attempt(label, call):
              start = time.monotonic()
              try:
                  result = call()
                  print(f"{label}: OK {result} in {time.monotonic() - start:.1f}s")
              except Exception as error:
                  print(f"{label}: {type(error).__name__}: {error} after {time.monotonic() - start:.1f}s")
          def classic():
              context = httpx.create_ssl_context()
              context.set_ecdh_curve("X25519")
              return context
          client = httpx.Client(verify=classic(), timeout=httpx.Timeout(60.0, connect=20.0), follow_redirects=True)
          attempt("default (control)", lambda: default_client().get(page).status_code)
          attempt("X25519 page", lambda: client.get(page).status_code)
          attempt("X25519 page, length", lambda: len(client.get(page).text))
          probe = "https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos/shpc/dsas/glp/glp-2026-01.csv"
          attempt("X25519 file range", lambda: client.get(probe, headers={"Range": "bytes=0-0"}).headers.get("content-range"))
          attempt("X25519 BCB", lambda: client.get("https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/1?formato=json").status_code)
          ctx = classic()
          import socket
          with socket.create_connection(("www.gov.br", 443), timeout=20) as raw, ctx.wrap_socket(raw, server_hostname="www.gov.br") as tls:
              print("negotiated:", tls.version(), tls.cipher()[0])
          PY
