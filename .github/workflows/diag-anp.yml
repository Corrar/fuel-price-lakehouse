name: diag-anp
# Temporary: how www.gov.br answers a GitHub-hosted runner. Deleted after use.
on:
  push:
    branches: [diag-anp]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev
      - name: Probe from Python
        run: |
          uv run --no-sync python - <<'PY'
          import socket, ssl, sys, time, urllib.request
          import httpx
          from fuel_price_lakehouse.collect.anp import LANDING_PAGE as page
          from fuel_price_lakehouse.collect.http import default_client
          print(sys.version, ssl.OPENSSL_VERSION, httpx.__version__)
          def attempt(label, call):
              start = time.monotonic()
              try:
                  result = call()
                  print(f"{label}: OK {result} in {time.monotonic() - start:.1f}s")
              except Exception as error:
                  print(f"{label}: {type(error).__name__}: {error} after {time.monotonic() - start:.1f}s")
          attempt("httpx default_client", lambda: default_client().get(page).status_code)
          attempt("httpx plain", lambda: httpx.get(page, timeout=30).status_code)
          attempt("urllib", lambda: urllib.request.urlopen(page, timeout=30).status)
          v4 = httpx.HTTPTransport(local_address="0.0.0.0")
          attempt("httpx IPv4 only", lambda: httpx.Client(transport=v4, timeout=30).get(page).status_code)
          ctx = ssl.create_default_context(); ctx.maximum_version = ssl.TLSVersion.TLSv1_2
          attempt("httpx TLS 1.2", lambda: httpx.get(page, timeout=30, verify=ctx).status_code)
          ctx2 = ssl.create_default_context(); ctx2.set_ciphers("DEFAULT")
          attempt("httpx DEFAULT ciphers", lambda: httpx.get(page, timeout=30, verify=ctx2).status_code)
          attempt("httpx BCB", lambda: httpx.get("https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/1?formato=json", timeout=30).status_code)
          attempt("httpx default_client again", lambda: default_client().get(page).status_code)
          PY
